[build]
  command = "node inject_mobile_fix.mjs"
  publish = "."

# Responsive mobile layout revision 8.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/responsive.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
